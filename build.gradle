plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'me.modmuss50.mod-publish-plugin' version '0.8.3'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude '**/.cache/**'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Forge 1.20.1 mods ship SRG-remapped; the jar in build/libs is the reobf'd one.
    finalizedBy 'reobfJar'
}

publishMods {
    file = jar.archiveFile
    modLoaders.add("forge")
    // Only the newest CHANGELOG entry: entries start with a bare "x.y.z" line.
    changelog = new File("$project.rootDir/CHANGELOG.md").getText('UTF-8').split(/(?m)^(?=\d+\.\d+\.\d+\s*$)/).find { it.trim() }.trim()
    version = "${minecraft_version}-${mod_version}"
    type = STABLE
    displayName = "alchemical-${minecraft_version}-${mod_version}"
    dryRun = System.getenv("PUBLISH_DRY_RUN") == "true"

    curseforge {
        projectId = "${curseforge_project}"
        projectSlug = "alchemical"
        accessToken = providers.environmentVariable("CF_TOKEN")

        minecraftVersions.add(minecraft_version)
        javaVersions.add(JavaVersion.VERSION_17)

        clientRequired = true
        serverRequired = true
    }

    // Discord announcement only when a webhook is configured, so dry runs work without one.
    if (System.getenv("DISCORD_WEBHOOK_URL")) {
        discord {
            webhookUrl = providers.environmentVariable("DISCORD_WEBHOOK_URL")
            dryRunWebhookUrl = providers.environmentVariable("DISCORD_WEBHOOK_TEST_URL")
            username = "Alchemical"
            style {
                look = "MODERN"
                color = "curseforge"
                link = "EMBED"
            }
        }
    }
}

// finalizedBy alone doesn't guarantee reobf runs before upload.
tasks.matching { it.name.startsWith('publish') && it.group == 'publishing' }.configureEach {
    dependsOn 'reobfJar'
}

// Full build (tests, checks) and then upload in one go: ./gradlew buildAndPublishMods
tasks.register("buildAndPublishMods") {
    group = "publishing"
    description = "Runs build, then publishMods."
    dependsOn "build", "publishMods"
}
tasks.named("publishMods").configure { mustRunAfter "build" }

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
